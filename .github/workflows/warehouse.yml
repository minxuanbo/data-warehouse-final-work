name: Full warehouse verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: olist_dw
          POSTGRES_USER: olist_admin
          POSTGRES_PASSWORD: ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist_admin -d olist_dw"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: olist_admin
      PGPASSWORD: ci_local_only
      PGDATABASE: olist_dw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/download_olist.py
      - name: Audit source and retain documented payment completeness failure
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['python', 'scripts/audit_olist.py'])
          if result.returncode not in (0, 2):
              raise SystemExit(result.returncode)
          PY
      - run: python scripts/verify_olist_audit.py
      - run: python scripts/warehouse.py run
      - run: python scripts/test_system.py
      - run: python scripts/warehouse.py benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse-evidence
          path: reports/system/
