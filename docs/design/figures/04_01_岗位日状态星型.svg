<text x="564" y="545" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="start" fill="#172e42">度量：job_count=1, is_core, body_valid</text>
<text x="564" y="575" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="start" fill="#172e42">技术引用：build_id, observation_key</text>
