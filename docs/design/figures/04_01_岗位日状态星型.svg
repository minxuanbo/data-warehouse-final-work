<text x="40" y="1238" font-family="Microsoft YaHei, sans-serif" font-size="20" text-anchor="start" fill="#172e42">原始观察、内容版本与构建审计保留在底层；主图聚焦业务分析，不将运行日志拼成业务星座。</text>
