<text x="558" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">源类别与标准类别分列</text>
<rect x="799" y="175" width="253" height="58" fill="#eaf1f8" stroke="#526779" stroke-width="1.5"/>
<text x="925" y="212" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#172e42">学历与经验</text>
<rect x="799" y="233" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="811" y="268" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">两个独立分析属性</text>
<rect x="799" y="289" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="811" y="324" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">本科、硕士等门槛</text>
<rect x="799" y="345" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="811" y="380" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">经验原区间保守保留</text>
<rect x="799" y="401" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="811" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">未知 / 不限 / 冲突分开</text>
<rect x="1052" y="175" width="253" height="58" fill="#eaf1f8" stroke="#526779" stroke-width="1.5"/>
<text x="1178" y="212" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#172e42">地点</text>
<rect x="1052" y="233" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1064" y="268" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">省 → 市</text>
<rect x="1052" y="289" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1064" y="324" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">一个岗位可有多地点</text>
<rect x="1052" y="345" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1064" y="380" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">按岗位集合取并集</text>
<rect x="1052" y="401" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1064" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">未映射不猜省份</text>
<rect x="1305" y="175" width="253" height="58" fill="#eaf1f8" stroke="#526779" stroke-width="1.5"/>
<text x="1431" y="212" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#172e42">技能</text>
<rect x="1305" y="233" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1317" y="268" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">标准技能名</text>
<rect x="1305" y="289" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1317" y="324" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">一个岗位可有多技能</text>
<rect x="1305" y="345" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1317" y="380" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">必需 / 优先 / 明确提及</text>
<rect x="1305" y="401" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="1317" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">否定与不确定仅审计</text>
<rect x="40" y="490" width="1518" height="216" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<rect x="40" y="490" width="1518" height="46" fill="#eaf1f8" stroke="#526779" stroke-width="1.5"/>
<text x="54" y="521" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">业务度量与汇总规则</text>
<text x="54" y="565" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">B01 岗位结构：不同核心岗位数、地区及方向分布；岗位数不是实际招聘人数。</text>
<text x="54" y="595" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">B02 技能需求：技能 / 组合覆盖岗位数 ÷ 有效正文岗位数；零技能命中仍保留正文分母。</text>
<text x="54" y="625" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">B03 门槛适配：学历、经验分布及技能交叉；未知和冲突单独解释。</text>
<text x="54" y="655" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">B04 观察变化：同范围、同规则、相邻完整日成立才计算；不等于企业新增或关闭。</text>
<text x="54" y="685" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">可加性：跨日岗位重复需去重，多技能 / 多城市分组不直接相加，比率重算分子分母。</text>
<text x="40" y="758" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="start" fill="#172e42">质量、采集与发布是分析支撑；业务实体 ER 不替代这个数仓概念模型。</text>
</svg>
