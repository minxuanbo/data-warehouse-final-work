<text x="52" y="268" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">年 → 季度 → 月 → 日</text>
<rect x="40" y="289" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="52" y="324" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">北京时间批次结束日</text>
<rect x="40" y="345" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="52" y="380" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">不是企业发布日期</text>
<rect x="40" y="401" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="52" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">当前不具备完整日趋势</text>
