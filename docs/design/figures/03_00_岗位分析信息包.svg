<text x="800" y="48" font-family="Microsoft YaHei, sans-serif" font-size="30" text-anchor="middle" fill="#172e42">图3-1 公开数字技术岗位需求分析信息包</text>
<text x="800" y="89" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="middle" fill="#172e42">使用者：人才培训与就业指导规划人员   决策：岗位方向、技能训练与门槛适配</text>
<text x="40" y="137" font-family="Microsoft YaHei, sans-serif" font-size="22" text-anchor="start" fill="#172e42">业务观察：官网在扫描窗口可见的岗位状态；一份日样本内，同一来源岗位只计一次。</text>
<rect x="40" y="175" width="253" height="58" fill="#eaf1f8" stroke="#526779" stroke-width="1.5"/>
<text x="166" y="212" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#172e42">时间</text>
