<text x="305" y="324" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">腾讯 / 网易官网</text>
<rect x="293" y="345" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
