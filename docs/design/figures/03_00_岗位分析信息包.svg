<text x="305" y="436" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">不将来源当法律雇主</text>
<rect x="546" y="175" width="253" height="58" fill="#eaf1f8" stroke="#526779" stroke-width="1.5"/>
<text x="672" y="212" font-family="Microsoft YaHei, sans-serif" font-size="24" text-anchor="middle" fill="#172e42">岗位方向</text>
