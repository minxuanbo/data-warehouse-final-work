<text x="558" y="324" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">开发 / 测试 / 数据</text>
<rect x="546" y="345" width="253" height="56" fill="#f6f8fa" stroke="#526779" stroke-width="1.5"/>
<text x="558" y="380" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="start" fill="#172e42">算法AI / 运维安全</text>
