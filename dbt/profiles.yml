# No credentials: local Windows identity, development database only.
recruitment_dw:
  target: dev
  outputs:
    dev:
      type: sqlserver
      driver: ODBC Driver 18 for SQL Server
      host: "{{ env_var('DW_SERVER', 'lpc:localhost') }}"
      port: null
      database: "{{ env_var('DW_DATABASE', 'recruitment_dw_dev') }}"
      schema: dbo
      windows_login: true
      encrypt: true
      trust_cert: true
      threads: 1
      login_timeout: 10
      retries: 0
