  - name: previous_date_key
    description: 严格相邻前一日的日历键；没有对应日汇总时不可比较。
  - name: source_posting_count
    description: 批次/构建中来源岗位观察数量；trial 含扩展，cd 概览含全部，不能称独立招聘人数。
  - name: core_posting_count
    description: 当前模型粒度下的核心来源岗位计数；多日状态不可直接累加为独立机会。
  - name: skill_denominator
    description: 当前模型粒度下全部有效正文核心岗位数，包括零技能命中；不从技能桥取分母。
  - name: expected_source_count
    description: 批准范围内预期的来源数量。
  - name: observed_source_count
    description: 该日实际选入的不同来源数。
  - name: complete_source_count
    description: 该日技术验收且 complete 的来源批次数。
  - name: is_complete
    description: 该日批准来源集合是否全部完整；不完整不可作变化基线。
  - name: is_comparable
    description: 当前与相邻前一日是否都完整，且发布固定同一规则/范围。
  - name: newly_observed_count
    description: 可比相邻日中新出现的来源岗位身份数，不等于企业新招聘。
  - name: first_discovered_count
    description: 本发布观察窗口内首次发现的岗位数；无完整基线时 NULL。
  - name: still_unobserved_count
    description: 曾出现但连续两个合格日未观察的身份数，不确认岗位关闭。
  - name: content_changed_count
    description: 可比日相同身份的代表内容哈希变化数，不含凭空追造历史。
  - name: comparison_note
    description: 变化计算成立或拒绝计算的业务原因。
