    description: release_id、date_key、job_key 拼接的 BI 关系键，用来区分多日状态。
  - name: skill_name
    description: 词典标准技能名，保留 SQL 与 MySQL 等不同概念。
  - name: eligible_for_metric
    description: 技能证据是否符合计量语境；计算岗位指标还须同时筛核心范围和正文有效。
  - name: evidence_field
    description: 职责、任职要求或补充要求的字段名。
  - name: evidence
    description: 来源正文逐字证据片段。
  - name: raw_ref
    description: 相对固定采集批次的原始详情文件路径，可连接 ods.raw_response。
  - name: evidence_start
    description: 证据片段起始 Unicode 字符索引（含），不是字节位置。
  - name: evidence_end
    description: 证据片段结束 Unicode 字符索引（不含）。
  - name: body_hash_version
    description: 技能输入正文规范化与哈希版本。
- name: job_demand_skill_profile
  description: B02 对外服务，物理名 ads.release_skill_profile；技能覆盖与类别正文分母。
  columns:
  - name: release_id
    description: 整组分析发布版本；固定输入构建、日期范围及规范化/映射规则，查询须显式选择。
  - name: date_key
    description: 北京时间批次结束日的 YYYYMMDD 键，引用 dim.calendar_date；不是岗位发布日期。
  - name: analysis_date
    description: 北京时间批次结束日，来自 manifest.finished_at；不是发布日期。
  - name: source
    description: 来源代码；与源岗位 ID 共同组成来源岗位自然键，来源不等于雇主。
  - name: category_group
    description: 快照中的标准岗位方向，按第2章初分类规则；来源原类别为 category_raw。
  - name: skill_name
    description: 词典标准技能名，保留 SQL 与 MySQL 等不同概念。
  - name: posting_count
    description: 当前维度组覆盖的不同来源岗位数；技能或城市分组之间可能重叠。
  - name: skill_denominator
    description: 当前模型粒度下全部有效正文核心岗位数，包括零技能命中；不从技能桥取分母。
  - name: skill_share
    description: 有效技能覆盖岗位数 / 对应完整正文岗位集合；技能筛选不反向缩小分母。
- name: release_validation
  description: 每实际发布违规一行；未发现违规为零行，不伪造通过行。
