  - name: skill_denominator
    description: 当前模型粒度下全部有效正文核心岗位数，包括零技能命中；不从技能桥取分母。
  - name: skilled_posting_count
    description: 该来源/方向正文集合中至少命中一项有效技能的不同岗位数。
  - name: body_coverage
    description: 有效正文核心岗位数 / 核心岗位数；零分母 NULL。
  - name: skill_coverage
    description: 至少命中一项有效技能的岗位数 / 有效正文岗位数；不等于词频。
- name: release_observed_change
  description: 每曾发布 release×分析日；只在完整相邻基线成立时计算变化。
  columns:
  - name: release_id
    description: 整组分析发布版本；固定输入构建、日期范围及规范化/映射规则，查询须显式选择。
