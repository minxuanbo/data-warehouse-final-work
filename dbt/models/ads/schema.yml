version: 2
models:
- name: cd_city
  description: 每构建×确认地点/冲突/未知组一行；来自核心 cd_job_detail，按 observation_key 去重。未统一行政区划与市后缀；BI 另作展示归一，各城市计数不可相加。
  columns:
  - name: build_id
    description: 不可变分析构建标识，引用 audit.analysis_build；一个构建绑定一个来源批次及规则集。
  - name: city_group
    description: 城市/地点分析分组；冲突与未知单列。cd_city 保留确认地点原值；dual_city 使用历史有限别名规则。
  - name: posting_count
    description: 当前分组中的不同来源岗位观察数；多技能/多城市分组不可直接加总。
- name: cd_education
  description: 每构建×学历组一行；来自核心 cd_job_detail，冲突独立成组，NULL 为未知；按来源岗位观察计数。
  columns:
  - name: build_id
    description: 不可变分析构建标识，引用 audit.analysis_build；一个构建绑定一个来源批次及规则集。
  - name: education_group
    description: 学历分布分组，NULL 归未知，冲突单组；不是已完成的标准学历维度。
  - name: posting_count
    description: 当前分组中的不同来源岗位观察数；多技能/多城市分组不可直接加总。
- name: cd_experience
  description: 每构建×经验组一行；来自核心 cd_job_detail，冲突独立成组；提示并不自动变冲突，NULL 为未知。
  columns:
  - name: build_id
    description: 不可变分析构建标识，引用 audit.analysis_build；一个构建绑定一个来源批次及规则集。
  - name: experience_group
    description: 经验分布组，NULL 归未知，冲突独立；不限与未知不合并。
  - name: posting_count
    description: 当前分组中的不同来源岗位观察数；多技能/多城市分组不可直接加总。
- name: cd_job_detail
  description: 每 ready 构建×来源岗位观察一行；连接构建、观察扩展、观察事实、身份、内容版本及批次；包括核心与扩展。当前不是跨源归并岗位，也不是每日快照。
  columns:
  - name: build_id
    description: 不可变分析构建标识，引用 audit.analysis_build；一个构建绑定一个来源批次及规则集。
  - name: scope_version
    description: 当前接口范围版本：trial/dual 为采集范围，cd 为分析核心范围；不可混作同一规则。
  - name: dictionary_version
    description: 技能词典版本，与构建和证据共同固定。
  - name: rule_version
    description: 技能提取规则版本。
  - name: body_hash_version
    description: 技能输入正文规范化与哈希版本。
  - name: build_status
    description: 分析构建状态；本接口只含 ready，但 ready 不代表正式多日发布。
  - name: batch_id
    description: 不可变采集批次标识；可回连 audit.collection_batch。
  - name: source
    description: 来源代码；与源岗位 ID 共同组成来源岗位自然键，来源不等于雇主。
  - name: source_job_id
    description: 来源岗位 ID 字符串；不得转数值或跨来源用裸 ID 去重。
  - name: observation_key
    description: 来源岗位观察代理键；业务唯一性为批次×来源岗位身份。
  - name: version_key
    description: 来源内容版本代理键，引用 dim.posting_version；SCD2 观察有效期，不是企业真实生效期。
  - name: title_raw
    description: 来源岗位标题原值。
  - name: analysis_date
    description: 观察时间换算 Asia/Shanghai 后的日期；不是发布日期，也不是目标日快照的批次结束日。
  - name: category_raw
    description: 源岗位类别原值；各来源编码未全部统一，不直接跨源合并同名类别。
  - name: education_raw
    description: 来源学历原值，不能把未知改写为不限。
  - name: experience_raw
    description: 来源经验原值。
  - name: source_url
    description: 原始岗位页面 URL，用于回查；网站内容可能变化，历史以保存响应为准。
  - name: body_valid
    description: 该构建技能输入范围内是否有可解析正文；三字段构建包含补充要求。仅表示输入可用，不表示命中技能。
  - name: is_core
    description: 是否属于当前版本核心数字技术岗位范围；不修改来源原记录。
  - name: scope_reason
    description: 岗位核心/扩展范围裁定原因。
  - name: additional_requirements_raw
    description: 从原始详情取出的补充要求原文；是否用于技能依 skill_text_scope。
  - name: location_notes_raw
    description: 来源地点补充说明原文。
  - name: location_conflict
    description: 地点冲突标记；分析分组显示冲突而非猜测城市。
  - name: experience_conflict
    description: 经验字段冲突标记；当前裁定与普通提示分别存储。
  - name: education_conflict
    description: 结构化学历与正文的待确认冲突标记；与 NULL/不限区别处理。
  - name: experience_hint
    description: 经验人工核查提示，可与冲突重叠；不自动当作冲突或排除岗位。
  - name: confirmed_locations_json
    description: 经当前范围策略裁定的地点数组；多值关系，不可按展开行数累计全局岗位数。
  - name: issues_json
    description: 本岗位可追溯的质量问题及人工裁定记录。
  - name: raw_ref
    description: 相对固定采集批次的原始详情文件路径，可连接 ods.raw_response。
  - name: raw_sha256
    description: 原始详情文件 SHA-256，核对原文是否被修改。
  - name: content_json
    description: 不可变来源内容版本原字段 JSON；使用完整 JSON 解析，避免 JSON_VALUE 截断长正文。
  - name: acceptance_status
    description: 采集批次技术验收状态；accepted 不表示覆盖完整或已经正式发布。
  - name: coverage_status
    description: 批准查询范围的遍历覆盖状态 complete/partial/failed；partial 不能驱动新增、下架趋势。
  - name: source_revision
    description: 固定输入批次的完整 Git 修订，配合文件清单恢复原始证据。
  - name: skill_text_scope
    description: 构建的正文输入字段集合；当前三字段为职责+要求+补充要求，历史两字段构建保持旧口径。
- name: cd_overview
  description: 每构建一行（当前构建只绑定一个来源批次）；直传 cd_scope_summary，保留所有 ready 历史构建，可供固定版本 BI 导入。
  columns:
  - name: build_id
    description: 不可变分析构建标识，引用 audit.analysis_build；一个构建绑定一个来源批次及规则集。
  - name: batch_id
    description: 不可变采集批次标识；可回连 audit.collection_batch。
  - name: source
    description: 来源代码；与源岗位 ID 共同组成来源岗位自然键，来源不等于雇主。
  - name: scope_version
