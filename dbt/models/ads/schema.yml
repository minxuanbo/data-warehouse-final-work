  - name: skill_text_scope
    description: 构建的正文输入字段集合；当前三字段为职责+要求+补充要求，历史两字段构建保持旧口径。
  - name: source_posting_count
    description: 批次/构建中来源岗位观察数量；trial 含扩展，cd 概览含全部，不能称独立招聘人数。
  - name: core_posting_count
    description: 当前构建核心范围内的不同来源岗位观察数，不是跨源独立招聘机会数。
  - name: skill_denominator
    description: 核心且有效正文的来源岗位数；包含无技能命中的岗位，不随技能桥过滤缩小。
  - name: additional_requirements_count
    description: 该构建中补充要求不为 NULL 的来源岗位数，含核心和扩展；不等同有效正文分母。
  - name: location_conflict_count
    description: 构建内全部来源岗位的地点冲突数，含扩展。
  - name: experience_conflict_count
    description: 该构建全部来源岗位的经验冲突数，含扩展。
  - name: education_conflict_count
    description: 该构建全部来源岗位中学历冲突数，含扩展。
  - name: experience_hint_count
    description: 该构建全部来源岗位中经验提示数，含实际冲突，不是冲突之外的新增计数。
- name: cd_quality_kpi
  description: 每构建×项目运营 KPI 一行；三项指标为核心正文覆盖、来源岗位原文可追溯、批准范围遍历完成。目标来自项目验收条件，不是招聘企业目标；无可比日序列时趋势为 NULL。
  columns:
  - name: build_id
    description: 不可变分析构建标识，引用 audit.analysis_build；一个构建绑定一个来源批次及规则集。
