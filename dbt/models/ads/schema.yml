  - name: coverage_status
    description: 批准查询范围的遍历覆盖状态 complete/partial/failed；partial 不能驱动新增、下架趋势。
  - name: acceptance_status
    description: 采集批次技术验收状态；accepted 不表示覆盖完整或已经正式发布。
  - name: kpi_code
    description: 项目运营 KPI 代码，与 build_id 组成接口业务唯一键。
  - name: kpi_name
    description: 项目运营 KPI 中文名称。
  - name: owner_role
    description: KPI 跟踪与整改责任角色，不是招聘企业内部组织。
  - name: numerator
    description: 项目 KPI 实际符合条件计数；按 kpi_code 解释，不可跨 KPI 累加。
  - name: denominator
    description: 项目 KPI 分母；正文为核心岗位数，溯源为全部来源岗位数，范围完成为一个批准批次。
  - name: kpi_value
    description: numerator / denominator；分母为零返回 NULL，不能改为零达标率。
  - name: goal_value
    description: project_acceptance_v1 的项目验收目标，三项均为 1.0，即 100%。
  - name: status_value
    description: 项目 KPI 状态：达到目标为 1，未达标为 -1，零分母为 NULL；不设置无依据的黄灯区间。
  - name: trend_value
    description: 当前固定为 NULL，避免以不同来源的两个批次假算趋势；NULL 不代表持平。
  - name: trend_reason
    description: 趋势缺失原因；当前没有同范围、同规则、连续完整的每日序列。
  - name: target_version
    description: 项目运营验收条件版本，不是老师指定的招聘市场目标。
- name: cd_skill_demand
  description: 每构建×标准技能一行；从 cd_eligible_job_skill 统计岗位数，分母来自 cd_scope_summary。分母不受技能选择影响，不同技能行不可相加当独立岗位数。
