services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: olist_dw
      POSTGRES_USER: olist_admin
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env first}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_admin -d olist_dw"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  olist_pgdata:
